name: Send Daily News Email

on:
  schedule:
    - cron: '0 0 * * *'   # 每天早上 8:00 北京时间 (UTC+8 = UTC 0:00)
  workflow_dispatch:        # 允许手动触发

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Send yesterday's digest
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import smtplib, os, glob
          from datetime import date, timedelta
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          yesterday = (date.today() - timedelta(days=1)).strftime('%Y-%m-%d')
          from_addr = "xiangmiaozi@gmail.com"
          to_addr   = "xiangmiaozi@gmail.com"
          password  = os.environ["GMAIL_APP_PASSWORD"]

          # 按优先顺序排列
          order = ["All", "all", "AI", "ai", "Backend", "backend", "Cloud", "cloud"]
          files = sorted(
              glob.glob(f"{yesterday}-*.html"),
              key=lambda f: next(
                  (i for i, k in enumerate(order) if f.endswith(f"-{k}.html")), 99
              )
          )

          if not files:
              print(f"No files found for {yesterday}, skipping.")
              exit(0)

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f'Daily News — {yesterday}'
          msg['From']    = from_addr
          msg['To']      = to_addr

          parts = []
          for f in files:
              category = f.replace(f'{yesterday}-', '').replace('.html', '')
              with open(f, encoding='utf-8') as fh:
                  content = fh.read()
              parts.append(
                  f'<h2 style="border-bottom:2px solid #555;padding-bottom:6px;margin-top:40px">'
                  f'{category}</h2>{content}'
              )

          html_body = '\n<hr style="margin:30px 0">\n'.join(parts)
          msg.attach(MIMEText(html_body, 'html', 'utf-8'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(from_addr, password)
              server.sendmail(from_addr, to_addr, msg.as_string())

          print(f"Sent: {yesterday} ({len(files)} files)")
          PYEOF
